x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@production_database:5432/rag_production_db
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  API_KEY: ${API_KEY:?Set API_KEY in .env}
  REDIS_URL: redis://redis:6379
  BASE_PATH: ${BASE_PATH:-/app/storage}

x-healthcheck: &api-healthcheck
  test:
    [
      "CMD",
      "python",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
    ]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 15s

services:
  production_database:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rag_production_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrations:
    build: .
    image: rag-api:local
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@production_database:5432/rag_production_db
      SECRET_KEY: migration-only-placeholder
      API_KEY: migration-only-placeholder
      REDIS_URL: redis://unused:6379
      BASE_PATH: /tmp/migration-storage
    depends_on:
      production_database:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    image: rag-api:local
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - uploads_data:${BASE_PATH:-/app/storage}
    depends_on:
      production_database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck

  worker:
    build: .
    image: rag-api:local
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - uploads_data:${BASE_PATH:-/app/storage}
    depends_on:
      production_database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    command:
      [
        "celery",
        "-A",
        "src.infrastructure.celery.celery_app.celery_app",
        "worker",
        "--loglevel=info",
      ]

  reverse_proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - ./caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    command: ["-config.file=/etc/loki/loki-config.yml"]

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?Set GF_SECURITY_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  grafana_data:
  uploads_data: