name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run test suite and linters in Compose
        run: >-
          docker compose -f docker-compose.test.yml run --rm --build tests_container

      - name: Start API stack and verify healthcheck
        run: >-
          docker compose -f docker-compose.test.yml up --detach --wait --wait-timeout 120 api

      - name: Verify the API health endpoint
        run: >-
          docker compose -f docker-compose.test.yml exec --no-TTY api
          python -c "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); body = json.load(response); assert response.status == 200 and body == {'status': 'ok'}, body"

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans