name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-compose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: tests_database_user
          POSTGRES_PASSWORD: tests_database_password
          POSTGRES_DB: tests_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tests_database_user -d tests_database"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://tests_database_user:tests_database_password@localhost:5432/tests_database
      SECRET_KEY: ci-only-secret-key
      API_KEY: ci-only-api-key
      REDIS_URL: memory://
      BASE_PATH: /tmp/rag-test-storage

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff checks
        run: |
          ruff check
          ruff format --check

      - name: Start the Docker Compose stack
        env:
          POSTGRES_USER: ci_postgres_user
          POSTGRES_PASSWORD: ci_postgres_password
          SECRET_KEY: ci-compose-only-secret
          API_KEY: ci-compose-only-api-key
          GF_SECURITY_ADMIN_USER: ci_admin
          GF_SECURITY_ADMIN_PASSWORD: ci_grafana_password
          BASE_PATH: /app/storage
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Verify the API health endpoint
        run: >-
          docker compose exec --no-TTY api
          python -c "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); body = json.load(response); assert response.status == 200 and body == {'status': 'ok'}, body"

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
